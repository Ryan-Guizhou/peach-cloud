name: peach-cloud

services:
  mysql:
    image: mysql:8.0
    container_name: peach-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1  # 忽略表名大小写
      - --bind-address=0.0.0.0  # 添加这一行
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: peach_cloud
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"  # 使用 3307 端口而不是 3306，避免与本地 MySQL 冲突
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql # 自动初始化数据库
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456" ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - peach-net
    # 资源限制
    cpus: '0.5'  # MySQL 给 0.5 核
    mem_limit: 512m  # MySQL 给 512MB 内存

  redis:
    image: redis:7.2-alpine
    container_name: peach-redis
    command: [ "redis-server", "--requirepass", "123456", "--appendonly", "yes" ]
    ports:
      - "6380:6379"  # 使用 6380 端口而不是 6379，避免与本地 Redis 冲突
    volumes:
      - ./data/redis:/data
      - ./logs/redis:/var/log/redis
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "123456", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - peach-net
    # 资源限制
    cpus: '0.3'  # Redis 给 0.3 核（Redis 是内存型，CPU 需求低）
    mem_limit: 256m  # Redis 给 256MB 内存

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: peach-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 128m
      JVM_XMX: 128m
      JVM_XMN: 64m
    ports:
      - "8849:8848"
      - "9849:9848"
    volumes:
      - ./logs/nacos:/home/nacos/logs
      - ./data/nacos:/home/nacos/data
    networks:
      - peach-net
    # 资源限制
    cpus: '0.5'  # Nacos 给 0.5 核
    mem_limit: 512m  # Nacos 给 512MB 内存

  peach-gateway:
    image: peach-cloud/peach-gateway:latest
    container_name: peach-gateway
    build:
      context: ./peach-gateway/peach-gateway-launch
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    volumes:
      - ./logs/peach-gateway:/app/logs
      - ./config/peach-gateway:/app/config
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      # Nacos 配置（关键）
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yml
      - SPRING_CLOUD_NACOS_CONFIG_ENCODE=UTF-8

      # Redis 配置（关键）
      - REDIS_HOST=redis:6379
      - PEACH_REDIS_HOST=redis:6379
      - REDIS_PASSWORD=123456
      - PEACH_REDIS_PASSWORD=123456
      - REDIS_DATABASE=0
    networks:
      - peach-net
    # 资源限制
    cpus: '1'  # 网关给 1 核
    mem_limit: 1g  # 网关给 1GB 内存

  peach-auth:
    image: peach-cloud/peach-auth:latest
    container_name: peach-auth
    build:
      context: ./peach-auth/peach-auth-launch
      dockerfile: Dockerfile
    ports:
      - "18081:18081"
    volumes:
      - ./logs/peach-auth:/app/logs
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      # Nacos 配置（关键）
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yml
      - SPRING_CLOUD_NACOS_CONFIG_ENCODE=UTF-8

      # MySQL 配置（关键）
      - DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456

      # Redis 配置（关键）
      - REDIS_HOST=redis:6379
      - PEACH_REDIS_HOST=redis:6379
      - REDIS_PASSWORD=123456
      - PEACH_REDIS_PASSWORD=123456
      - REDIS_DATABASE=0
    networks:
      - peach-net
    # 资源限制
    cpus: '1'  # 认证服务给 1 核
    mem_limit: 1g  # 认证服务给 1GB 内存

  peach-monitor:
    image: peach-cloud/peach-monitor:latest
    container_name: peach-monitor
    build:
      context: ./peach-monitor/peach-monitor-launch
      dockerfile: Dockerfile
    ports:
      - "18082:18082"
    volumes:
      - ./logs/peach-monitor:/app/logs
      - ./config/peach-monitor:/app/config
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      # Nacos 配置（关键）
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yml
      - SPRING_CLOUD_NACOS_CONFIG_ENCODE=UTF-8

      # MySQL 配置（关键）
      - DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456

      # Redis 配置（关键）
      - REDIS_HOST=redis:6379
      - PEACH_REDIS_HOST=redis:6379
      - REDIS_PASSWORD=123456
      - PEACH_REDIS_PASSWORD=123456
      - REDIS_DATABASE=0
    networks:
      - peach-net
    # 资源限制
    cpus: '1'  # 监控服务给 1 核
    mem_limit: 1g  # 监控服务给 1GB 内存

  peach-fileservice:
    image: peach-cloud/peach-fileservice:latest
    container_name: peach-fileservice
    build:
      context: ./peach-fileservice/peach-fileservice-launch
      dockerfile: Dockerfile
    ports:
      - "18083:18083"
    volumes:
      - ./logs/peach-fileservice:/app/logs
      - ./config/peach-fileservice:/app/config
      - ./upload:/app/upload
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      # Nacos 配置（关键）
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yml
      - SPRING_CLOUD_NACOS_CONFIG_ENCODE=UTF-8

      # MySQL 配置（关键）
      - DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456

      # Redis 配置（关键）
      - REDIS_HOST=redis:6379
      - PEACH_REDIS_HOST=redis:6379
      - REDIS_PASSWORD=123456
      - PEACH_REDIS_PASSWORD=123456
      - REDIS_DATABASE=0
    networks:
      - peach-net
    # 资源限制
    cpus: '1'  # 文件服务给 1 核
    mem_limit: 1g  # 文件服务给 1GB 内存

  peach-message:
    image: peach-cloud/peach-message:latest
    container_name: peach-message
    build:
      context: ./peach-message/peach-message-launch
      dockerfile: Dockerfile
    ports:
      - "18084:18084"
    volumes:
      - ./logs/peach-message:/app/logs
      - ./config/peach-message:/app/config
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      # Nacos 配置（关键）
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yml
      - SPRING_CLOUD_NACOS_CONFIG_ENCODE=UTF-8

      # MySQL 配置（关键）
      - DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456

      # Redis 配置（关键）
      - REDIS_HOST=redis:6379
      - PEACH_REDIS_HOST=redis:6379
      - REDIS_PASSWORD=123456
      - PEACH_REDIS_PASSWORD=123456
      - REDIS_DATABASE=0
    networks:
      - peach-net
    # 资源限制
    cpus: '1'  # 消息服务给 1 核
    mem_limit: 1g  # 消息服务给 1GB 内存

  peach-setting:
    image: peach-cloud/peach-setting:latest
    container_name: peach-setting
    build:
      context: ./peach-setting/peach-setting-launch
      dockerfile: Dockerfile
    ports:
      - "18085:18085"
    volumes:
      - ./logs/peach-setting:/app/logs
      - ./config/peach-setting:/app/config
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      # Nacos 配置（关键）
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=bb1fa0d2-f008-4ea0-8d2c-0d4f22bb3375
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=PEACH-CLOUD
      - SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION=yml
      - SPRING_CLOUD_NACOS_CONFIG_ENCODE=UTF-8

      # MySQL 配置（关键）
      - DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/peach_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456

      # Redis 配置（关键）
      - REDIS_HOST=redis:6379
      - PEACH_REDIS_HOST=redis:6379
      - REDIS_PASSWORD=123456
      - PEACH_REDIS_PASSWORD=123456
      - REDIS_DATABASE=0
    networks:
      - peach-net
    # 资源限制
    cpus: '1'  # 设置服务给 1 核
    mem_limit: 1g  # 设置服务给 1GB 内存

networks:
  peach-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  nacos_data:
    driver: local