name: peach-devops

services:
  registry:
    image: registry:3
    container_name: local-registry
    hostname: registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - devops

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    hostname: registry-ui
    restart: unless-stopped
    ports:
      - "5001:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Peach Docker Registry"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      SHOW_CATALOG_NB_TAGS: "true"
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: "1000"
      TAGLIST_PAGE_SIZE: "100"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      NGINX_RESOLVER: "127.0.0.11"
      PULL_URL: "localhost:5000"
    depends_on:
      - registry
    networks:
      - devops

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: peachsoft.gitlab.local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.peachsoft.com'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        letsencrypt['enable'] = false
        gitlab_rails['smtp_enable'] = false
    ports:
      - "8929:80"
      - "2424:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - type: bind
        source: ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/devops/gitlab
        target: /var/log/gitlab
        bind:
          create_host_path: true
      - gitlab-data:/var/opt/gitlab
    shm_size: "256m"
    networks:
      - devops

  nexus:
    image: sonatype/nexus3:${NEXUS_VERSION:-3.75.1}
    container_name: nexus
    hostname: nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_HOST_PORT:-8081}:8081"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - devops

  jenkins:
    build:
      context: ../../images/jenkins
      dockerfile: Dockerfile
    image: peach-jenkins:lts-jdk21
    container_name: jenkins
    hostname: jenkins
    user: root
    restart: unless-stopped
    depends_on:
      registry:
        condition: service_started
      nexus:
        condition: service_started
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: >-
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops
      - runtime

  nginx:
    image: nginx:${NGINX_VERSION:-1.25-alpine}
    container_name: peach-devops-nginx
    hostname: peach-devops-nginx
    restart: unless-stopped
    ports:
      - "${DEVOPS_HTTP_PORT:-80}:80"
    volumes:
      - ../../config/nginx/devops.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/devops/nginx
        target: /var/log/nginx
        bind:
          create_host_path: true
    depends_on:
      - gitlab
      - jenkins
      - registry
      - registry-ui
      - nexus
    networks:
      - devops
      - runtime

networks:
  devops:
    external: true
    name: peach-devops
  runtime:
    external: true
    name: peach-cloud-runtime

volumes:
  registry-data:
    external: true
    name: peach-registry-data
  gitlab-config:
    external: true
    name: peach-gitlab-config
  gitlab-data:
    external: true
    name: peach-gitlab-data
  jenkins-data:
    external: true
    name: peach-jenkins-data
  nexus-data:
    external: true
    name: peach-nexus-data
