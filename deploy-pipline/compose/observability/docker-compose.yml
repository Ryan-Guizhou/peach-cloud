name: peach-observability

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.12.0}
    container_name: peach-prometheus
    hostname: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../../config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devops
      - runtime

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.7}
    container_name: peach-tempo
    hostname: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../../config/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - devops

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.153.0}
    container_name: peach-otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ../../config/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      tempo:
        condition: service_started
    networks:
      - devops
      - runtime

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.4}
    container_name: peach-loki
    hostname: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../../config/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - devops

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.18.0}
    container_name: peach-alloy
    hostname: alloy
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ../../config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-gateway:/var/log/peach/gateway:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-auth:/var/log/peach/auth:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-monitor:/var/log/peach/monitor:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-fileservice:/var/log/peach/fileservice:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-message:/var/log/peach/message:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-setting:/var/log/peach/setting:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-generator:/var/log/peach/generator:ro
      - ${PEACH_LOG_ROOT:?Set PEACH_LOG_ROOT}/application/peach-scheduled:/var/log/peach/scheduled:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - devops

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    container_name: peach-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ../../config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - devops

networks:
  devops:
    external: true
    name: peach-devops
  runtime:
    external: true
    name: peach-cloud-runtime

volumes:
  prometheus-data:
    external: true
    name: peach-prometheus-data
  tempo-data:
    external: true
    name: peach-tempo-data
  loki-data:
    external: true
    name: peach-loki-data
  alloy-data:
    external: true
    name: peach-alloy-data
  grafana-data:
    external: true
    name: peach-grafana-data
