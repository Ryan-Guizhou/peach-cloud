name: ${COMPOSE_PROJECT_NAME:-peach-cloud}

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}
  JAVA_OPTS: ${JAVA_OPTS:-}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
  SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE_ID:-peach-cloud}
  SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE_ID:-peach-cloud}
  SPRING_CLOUD_NACOS_CONFIG_GROUP: ${NACOS_GROUP:-PEACH-CLOUD}
  SPRING_CLOUD_NACOS_DISCOVERY_GROUP: ${NACOS_GROUP:-PEACH-CLOUD}
  SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION: yml
  SPRING_CLOUD_NACOS_CONFIG_ENCODE: UTF-8
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-peach_cloud}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  REDIS_HOST: redis:6379
  PEACH_REDIS_HOST: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  PEACH_REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: 0
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: 6379
  SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,prometheus}
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-never}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
  MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:-true}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}

services:
  mysql:
    image: mysql:8.0
    container_name: peach-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
      - --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-peach_cloud}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - peach-mysql-data:/var/lib/mysql
      - peach-mysql-logs:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - peach-net

  redis:
    image: redis:7.2-alpine
    container_name: peach-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - peach-redis-data:/data
      - peach-redis-logs:/var/log/redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - peach-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: peach-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NACOS_HOST_PORT:-8849}:8848"
      - "${NACOS_GRPC_HOST_PORT:-9850}:9848"
    volumes:
      - peach-nacos-data:/home/nacos/data
      - peach-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    networks:
      - peach-net

  peach-gateway:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-gateway:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-gateway
    environment:
      <<: *common-env
      SERVER_PORT: ${GATEWAY_PORT:-18080}
      SPRING_APPLICATION_NAME: peach-gateway
    volumes:
      - peach-gateway-logs:/app/logs
      - peach-gateway-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-auth:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-auth:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-auth
    environment:
      <<: *common-env
      SERVER_PORT: ${AUTH_PORT:-18081}
      SPRING_APPLICATION_NAME: peach-auth
    volumes:
      - peach-auth-logs:/app/logs
      - peach-auth-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-monitor:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-monitor:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-monitor
    environment:
      <<: *common-env
      SERVER_PORT: ${MONITOR_PORT:-18082}
      SPRING_APPLICATION_NAME: peach-monitor
    volumes:
      - peach-monitor-logs:/app/logs
      - peach-monitor-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-fileservice:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-fileservice:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-fileservice
    environment:
      <<: *common-env
      SERVER_PORT: ${FILESERVICE_PORT:-18083}
      SPRING_APPLICATION_NAME: peach-fileservice
      PEACH_UPLOAD_ROOT: /app/upload
    volumes:
      - peach-fileservice-logs:/app/logs
      - peach-fileservice-config:/app/config
      - peach-fileservice-upload:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-message:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-message:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-message
    environment:
      <<: *common-env
      SERVER_PORT: ${MESSAGE_PORT:-18084}
      SPRING_APPLICATION_NAME: peach-message
    volumes:
      - peach-message-logs:/app/logs
      - peach-message-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-setting:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-setting:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-setting
    environment:
      <<: *common-env
      SERVER_PORT: ${SETTING_PORT:-18085}
      SPRING_APPLICATION_NAME: peach-setting
    volumes:
      - peach-setting-logs:/app/logs
      - peach-setting-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-generator:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-generator:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-generator
    environment:
      <<: *common-env
      SERVER_PORT: ${GENERATOR_PORT:-18086}
      SPRING_APPLICATION_NAME: peach-generator
    volumes:
      - peach-generator-logs:/app/logs
      - peach-generator-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-scheduled:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-scheduled:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-scheduled
    environment:
      <<: *common-env
      SERVER_PORT: ${SCHEDULED_PORT:-18087}
      SPRING_APPLICATION_NAME: peach-scheduled
    volumes:
      - peach-scheduled-logs:/app/logs
      - peach-scheduled-config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - peach-net
      - devops-net

  peach-front:
    image: ${PEACH_IMAGE_PREFIX:-peach-cloud}/peach-front:${PEACH_IMAGE_TAG:-latest}
    container_name: peach-front
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-18080}
    volumes:
      - peach-front-nginx-logs:/var/log/nginx
    depends_on:
      peach-gateway:
        condition: service_started
    networks:
      - peach-net

networks:
  peach-net:
    name: peach-cloud-runtime
    driver: bridge
  devops-net:
    name: peach-devops
    external: true

volumes:
  peach-mysql-data:
    name: peach-mysql-data
  peach-mysql-logs:
    name: peach-mysql-logs
  peach-redis-data:
    name: peach-redis-data
  peach-redis-logs:
    name: peach-redis-logs
  peach-nacos-data:
    name: peach-nacos-data
  peach-nacos-logs:
    name: peach-nacos-logs
  peach-gateway-logs:
    name: peach-gateway-logs
  peach-gateway-config:
    name: peach-gateway-config
  peach-auth-logs:
    name: peach-auth-logs
  peach-auth-config:
    name: peach-auth-config
  peach-monitor-logs:
    name: peach-monitor-logs
  peach-monitor-config:
    name: peach-monitor-config
  peach-fileservice-logs:
    name: peach-fileservice-logs
  peach-fileservice-config:
    name: peach-fileservice-config
  peach-fileservice-upload:
    name: peach-fileservice-upload
  peach-message-logs:
    name: peach-message-logs
  peach-message-config:
    name: peach-message-config
  peach-setting-logs:
    name: peach-setting-logs
  peach-setting-config:
    name: peach-setting-config
  peach-generator-logs:
    name: peach-generator-logs
  peach-generator-config:
    name: peach-generator-config
  peach-scheduled-logs:
    name: peach-scheduled-logs
  peach-scheduled-config:
    name: peach-scheduled-config
  peach-front-nginx-logs:
    name: peach-front-nginx-logs
