# 端口号
server:
  port: 18080

# 网关satoken 白名单和风险控制配置
peach:
  gateway:
    satoken:
      enabled: true
      inject-same-token: true
      token-strategy-enabled: true
      log-path: true
      public-endpoints:
        - method: OPTIONS
          path: /**
        - method: ANY
          path: /login
        - method: ANY
          path: /logout
        - method: ANY
          path: /register
        - method: ANY
          path: /getCaptcha
        - method: ANY
          path: /checkCaptcha
        - method: ANY
          path: /init
        - method: ANY
          path: /doc.html
        - method: ANY
          path: /swagger-resources
        - method: ANY
          path: /swagger-resources/**
        - method: ANY
          path: /webjars
        - method: ANY
          path: /webjars/**
        - method: ANY
          path: /v3/api-docs
        - method: ANY
          path: /v3/api-docs/**
        - method: ANY
          path: /v2/api-docs
        - method: ANY
          path: /v2/api-docs/**
        - method: ANY
          path: /actuator
        - method: ANY
          path: /actuator/**
        - method: ANY
          path: /health
        - method: ANY
          path: health
        - method: ANY
          path: /sse
        - method: ANY
          path: /sse/**
        - method: ANY
          path: /favicon.ico
        - method: POST
          path: /api/auth/login
        - method: POST
          path: /api/auth/logout
        - method: POST
          path: /api/auth/register
        - method: POST
          path: /api/auth/forget
        - method: POST
          path: /api/auth/reset
        - method: POST
          path: /api/auth/getCaptcha
        - method: POST
          path: /api/auth/checkCaptcha
        - method: POST
          path: /api/auth/init
        - method: GET
          path: /api/auth/rsa-public-key
        - method: ANY
          path: /api/doc.html
        - method: ANY
          path: /api/swagger-resources
        - method: ANY
          path: /api/swagger-resources/**
        - method: ANY
          path: /api/webjars
        - method: ANY
          path: /api/webjars/**
        - method: ANY
          path: /api/v3/api-docs
        - method: ANY
          path: /api/v3/api-docs/**
        - method: ANY
          path: /api/v2/api-docs
        - method: ANY
          path: /api/v2/api-docs/**
        - method: ANY
          path: /api/actuator
        - method: ANY
          path: /api/actuator/**
        - method: ANY
          path: /api/health
        - method: ANY
          path: /api/sse
        - method: ANY
          path: /api/sse/**
        - method: ANY
          path: /api/favicon.ico
        - method: GET
          path: /api/auth/v3/api-docs
        - method: GET
          path: /api/fileservice/v3/api-docs
        - method: GET
          path: /api/message/v3/api-docs
        - method: GET
          path: /api/setting/v3/api-docs
        - method: GET
          path: /api/generator/v3/api-docs
        - method: GET
          path: /api/monitor/v3/api-docs
        - method: GET
          path: /api/monitor/actuator/**
        - method: GET
          path: /api/monitor/health
    risk-control:
      enabled: true
      max-uri-length: 2048
      max-header-count: 100
      blocked-ips:
      blocked-user-agents:

# 响应式配置
spring.main:
    web-application-type: reactive
spring.reactor:
    context-propagation: auto

# 网关路由配置
spring.cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: peach-auth-swagger
              uri: lb://peach-auth
              predicates:
                - Path=/api/auth/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: peach-monitor-swagger
              uri: lb://peach-monitor
              predicates:
                - Path=/api/monitor/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: peach-fileservice-swagger
              uri: lb://peach-fileservice
              predicates:
                - Path=/api/fileservice/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: peach-setting-swagger
              uri: lb://peach-setting
              predicates:
                - Path=/api/setting/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: peach-message-swagger
              uri: lb://peach-message
              predicates:
                - Path=/api/message/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: peach-generator-swagger
              uri: lb://peach-generator
              predicates:
                - Path=/api/generator/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: peach-auth
              uri: lb://peach-auth
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: peach-monitor
              uri: lb://peach-monitor
              predicates:
                - Path=/api/monitor/**
              filters:
                - StripPrefix=1
            - id: peach-fileservice
              uri: lb://peach-fileservice
              predicates:
                - Path=/api/file/**
              filters:
                - StripPrefix=1
            - id: peach-setting
              uri: lb://peach-setting
              predicates:
                - Path=/api/setting/**
              filters:
                - StripPrefix=1
            - id: peach-message-ws
              uri: lb:ws://peach-message
              predicates:
                - Path=/webSocket/**
            - id: peach-message
              uri: lb://peach-message
              predicates:
                - Path=/api/message/**
              filters:
                - StripPrefix=1
            - id: peach-generator
              uri: lb://peach-generator
              predicates:
                - Path=/api/generator/**
              filters:
                - StripPrefix=1

# 网关聚合knife4j 配置
knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: 认证服务
        url: /api/auth/v3/api-docs
        service-name: peach-auth
        context-path: /api/auth
        order: 1
      - name: 监控服务
        url: /api/monitor/v3/api-docs
        service-name: peach-monitor
        context-path: /api/monitor
        order: 2
      - name: 文件服务
        url: /api/file/v3/api-docs
        service-name: peach-fileservice
        context-path: /api/fileservice
        order: 3
      - name: 消息服务
        url: /api/message/v3/api-docs
        service-name: peach-message
        context-path: /api/message
        order: 4
      - name: 设置服务
        url: /api/setting/v3/api-docs
        service-name: peach-setting
        context-path: /api/setting
        order: 5
      - name: 代码生成服务
        url: /api/generator/v3/api-docs
        service-name: peach-generator
        context-path: /api/generator
        order: 6



