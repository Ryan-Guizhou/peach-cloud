name: peach-devops

services:

  # ============================================================
  # Docker Registry
  #
  # Windows:
  #   http://localhost:5000/v2/
  #
  # Catalog:
  #   http://localhost:5000/v2/_catalog
  #
  # Jenkins / Docker 内部:
  #   registry:5000
  # ============================================================
  registry:
    image: registry:3
    container_name: local-registry
    hostname: registry
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    volumes:
      - registry-data:/var/lib/registry

    networks:
      - devops


  # ============================================================
  # Docker Registry UI
  #
  # Windows:
  #   http://localhost:5001
  # ============================================================
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    hostname: registry-ui
    restart: unless-stopped

    ports:
      - "5001:80"

    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Peach Docker Registry"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      SHOW_CATALOG_NB_TAGS: "true"
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: "1000"
      TAGLIST_PAGE_SIZE: "100"

      NGINX_PROXY_PASS_URL: "http://registry:5000"
      NGINX_RESOLVER: "127.0.0.11"

      PULL_URL: "localhost:5000"

    depends_on:
      - registry

    networks:
      - devops


  # ============================================================
  # GitLab CE
  #
  # Nginx:
  #   http://gitlab.peachsoft.com
  #
  # Direct fallback:
  #   http://localhost:8929
  #
  # SSH:
  #   ssh://git@gitlab.peachsoft.com:2424
  #
  # Jenkins 内部:
  #   http://gitlab
  #
  # 保留现有 GitLab 配置和数据卷。
  # ============================================================
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: peachsoft.gitlab.local
    restart: unless-stopped

    environment:
      TZ: "Asia/Shanghai"

      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.peachsoft.com'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        letsencrypt['enable'] = false
        gitlab_rails['smtp_enable'] = false

    ports:
      - "8929:80"
      - "2424:22"

    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

    shm_size: "256m"

    networks:
      - devops


  # ============================================================
  # Sonatype Nexus 3 (Maven private repository / proxy cache)
  #
  # Browser:
  #   http://nexus.peachsoft.com
  #
  # Direct fallback:
  #   http://localhost:8081
  #
  # Jenkins / Maven CI container (same peach-devops network):
  #   http://nexus:8081/repository/maven-public/
  # ============================================================
  nexus:
    image: sonatype/nexus3:3.75.1
    container_name: nexus
    hostname: nexus
    restart: unless-stopped

    ports:
      - "${NEXUS_HOST_PORT:-8081}:8081"

    environment:
      TZ: "Asia/Shanghai"
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m"

    volumes:
      - nexus-data:/nexus-data

    networks:
      - devops

  # ============================================================
  # Observability infrastructure (started before applications)
  # ============================================================
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.12.0}
    container_name: peach-prometheus
    hostname: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devops

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.7}
    container_name: peach-tempo
    hostname: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - devops

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.153.0}
    container_name: peach-otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ../observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      tempo:
        condition: service_started
    networks:
      - devops

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.4}
    container_name: peach-loki
    hostname: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - devops

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.18.0}
    container_name: peach-alloy
    hostname: alloy
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - peach-gateway-logs:/var/log/peach/gateway:ro
      - peach-auth-logs:/var/log/peach/auth:ro
      - peach-monitor-logs:/var/log/peach/monitor:ro
      - peach-fileservice-logs:/var/log/peach/fileservice:ro
      - peach-message-logs:/var/log/peach/message:ro
      - peach-setting-logs:/var/log/peach/setting:ro
      - peach-generator-logs:/var/log/peach/generator:ro
      - peach-scheduled-logs:/var/log/peach/scheduled:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - devops

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    container_name: peach-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - devops


  # ============================================================
  # Jenkins
  #
  # Nginx:
  #   http://jenkins.peachsoft.com
  #
  # Direct fallback:
  #   http://localhost:8080
  #
  # GitLab:
  #   http://gitlab
  #
  # Registry:
  #   localhost:5000
  #
  # Nexus:
  #   http://nexus:8081
  #
  # Docker Engine:
  #   Docker Desktop via /var/run/docker.sock
  #
  # Maven 本地仓库与 settings：
  #   /var/jenkins_home/.m2 由 jenkins-data 持久化；
  #   settings.generated.xml 由 Jenkinsfile 基于 deploy-pipline/maven/settings.xml 渲染。
  # ============================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    image: peach-jenkins:lts-jdk21
    container_name: jenkins
    hostname: jenkins
    user: root
    restart: unless-stopped

    depends_on:
      registry:
        condition: service_started
      nexus:
        condition: service_started

    ports:
      - "8080:8080"
      - "50000:50000"

    environment:
      TZ: "Asia/Shanghai"

      JAVA_OPTS: >-
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - devops

  # ============================================================
  # DevOps Reverse Proxy（运维入口，与业务前端分离）
  #
  # 业务（仅前端 + API）：
  #   http://peach_cloud.peachsoft.com
  #
  # DevOps 独立子域（书签访问，勿与业务混在同一 location 树）：
  #   http://jenkins.peachsoft.com
  #   http://gitlab.peachsoft.com
  #   http://registry.peachsoft.com
  #   http://nacos.peachsoft.com
  #   http://nexus.peachsoft.com
  #   http://grafana.peachsoft.com
  #   http://prometheus.peachsoft.com
  #
  # Maven / CI 推荐直连 Nexus 容器端口或 nexus:8081，不经本 Nginx。
  # 详见 deploy-pipline/docs/nginx-architecture.md
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: peach-devops-nginx
    hostname: peach-devops-nginx
    restart: unless-stopped

    ports:
      - "${DEVOPS_HTTP_PORT:-80}:80"

    volumes:
      - ./nginx/devops.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - gitlab
      - jenkins
      - registry
      - registry-ui
      - nexus
      - grafana
      - prometheus

    networks:
      - devops


# ==============================================================
# Docker Named Volumes
# ==============================================================
volumes:

  # Docker Registry
  registry-data:
    name: peach-registry-data


  # GitLab
  gitlab-config:
    name: peach-gitlab-config

  gitlab-logs:
    name: peach-gitlab-logs

  gitlab-data:
    name: peach-gitlab-data


  # Jenkins
  jenkins-data:
    name: peach-jenkins-data

  # Nexus Repository
  nexus-data:
    name: peach-nexus-data

  prometheus-data:
    name: peach-prometheus-data
  tempo-data:
    name: peach-tempo-data
  loki-data:
    name: peach-loki-data
  alloy-data:
    name: peach-alloy-data
  grafana-data:
    name: peach-grafana-data

  peach-gateway-logs:
    name: peach-gateway-logs
  peach-auth-logs:
    name: peach-auth-logs
  peach-monitor-logs:
    name: peach-monitor-logs
  peach-fileservice-logs:
    name: peach-fileservice-logs
  peach-message-logs:
    name: peach-message-logs
  peach-setting-logs:
    name: peach-setting-logs
  peach-generator-logs:
    name: peach-generator-logs
  peach-scheduled-logs:
    name: peach-scheduled-logs


# ==============================================================
# Docker Network
# ==============================================================
networks:

  devops:
    name: peach-devops
    driver: bridge
