name: peach-devops

services:

  # ============================================================
  # Docker Registry
  #
  # Windows:
  #   http://localhost:5000/v2/
  #
  # Catalog:
  #   http://localhost:5000/v2/_catalog
  #
  # Jenkins / Docker 内部:
  #   registry:5000
  # ============================================================
  registry:
    image: registry:3
    container_name: local-registry
    hostname: registry
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    volumes:
      - registry-data:/var/lib/registry

    networks:
      - devops


  # ============================================================
  # Docker Registry UI
  #
  # Windows:
  #   http://localhost:5001
  # ============================================================
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    hostname: registry-ui
    restart: unless-stopped

    ports:
      - "5001:80"

    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Peach Docker Registry"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      SHOW_CATALOG_NB_TAGS: "true"
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: "1000"
      TAGLIST_PAGE_SIZE: "100"

      NGINX_PROXY_PASS_URL: "http://registry:5000"
      NGINX_RESOLVER: "127.0.0.11"

      PULL_URL: "localhost:5000"

    depends_on:
      - registry

    networks:
      - devops


  # ============================================================
  # GitLab CE
  #
  # Nginx:
  #   http://peachsoft.gitlab.test
  #
  # Direct fallback:
  #   http://localhost:8929
  #
  # SSH:
  #   ssh://git@peachsoft.gitlab.test:2424
  #
  # Jenkins 内部:
  #   http://gitlab
  #
  # 保留现有 GitLab 配置和数据卷。
  # ============================================================
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: peachsoft.gitlab.local
    restart: unless-stopped

    environment:
      TZ: "Asia/Shanghai"

      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://peachsoft.gitlab.test'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        letsencrypt['enable'] = false
        gitlab_rails['smtp_enable'] = false

    ports:
      - "8929:80"
      - "2424:22"

    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

    shm_size: "256m"

    networks:
      - devops


  # ============================================================
  # Jenkins Docker Engine
  #
  # Jenkins:
  #
  # docker CLI
  #     |
  #     | TLS :2376
  #     v
  # docker:dind
  #
  # Registry 使用 HTTP，所以配置 insecure-registry。
  # ============================================================
  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    hostname: jenkins-docker
    restart: unless-stopped

    privileged: true

    environment:
      DOCKER_TLS_CERTDIR: "/certs"

    command:
      - "--storage-driver=overlay2"
      - "--insecure-registry=registry:5000"

    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
      - jenkins-data:/var/jenkins_home

    healthcheck:
      test:
        - CMD
        - docker
        - info
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      devops:
        aliases:
          - docker


  # ============================================================
  # Jenkins
  #
  # Nginx:
  #   http://peachsoft.jenkins.test
  #
  # Direct fallback:
  #   http://localhost:8080
  #
  # GitLab:
  #   http://gitlab
  #
  # Registry:
  #   registry:5000
  #
  # Docker Engine:
  #   tcp://docker:2376
  #
  # 注意：
  # Maven 本地仓库不再单独挂载 volume。
  #
  # 因为整个 /var/jenkins_home 已经由 jenkins-data 持久化，
  # 所以 /var/jenkins_home/.m2 同样会被持久化。
  # ============================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    image: peach-jenkins:lts-jdk21
    container_name: jenkins
    hostname: jenkins
    restart: unless-stopped

    depends_on:
      jenkins-docker:
        condition: service_healthy

      registry:
        condition: service_started

    ports:
      - "8080:8080"
      - "50000:50000"

    environment:
      TZ: "Asia/Shanghai"

      JAVA_OPTS: >-
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8

      DOCKER_HOST: "tcp://docker:2376"
      DOCKER_CERT_PATH: "/certs/client"
      DOCKER_TLS_VERIFY: "1"

    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro

    networks:
      - devops

  # ============================================================
  # DevOps Reverse Proxy
  #
  # Primary domains:
  #   http://peachsoft.peach-cloud.test
  #   http://peachsoft.jenkins.test
  #   http://peachsoft.gitlab.test
  #   http://peachsoft.registry.test
  #   http://peachsoft.nacos.test
  #
  # peachsoft.peach-cloud.test proxies the deployed Peach frontend
  # after Jenkins starts it inside jenkins-docker. The helper paths
  # /jenkins, /gitlab, /registry and /nacos provide a single-domain
  # entry point for common DevOps consoles.
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: peach-devops-nginx
    hostname: peach-devops-nginx
    restart: unless-stopped

    ports:
      - "${DEVOPS_HTTP_PORT:-80}:80"

    volumes:
      - ./nginx/devops.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - gitlab
      - jenkins
      - registry
      - registry-ui
      - jenkins-docker

    networks:
      - devops


# ==============================================================
# Docker Named Volumes
# ==============================================================
volumes:

  # Docker Registry
  registry-data:
    name: peach-registry-data


  # GitLab
  gitlab-config:
    name: peach-gitlab-config

  gitlab-logs:
    name: peach-gitlab-logs

  gitlab-data:
    name: peach-gitlab-data


  # Jenkins
  jenkins-data:
    name: peach-jenkins-data


  # Jenkins Docker Engine
  jenkins-docker-certs:
    name: peach-jenkins-docker-certs

  jenkins-docker-data:
    name: peach-jenkins-docker-data


# ==============================================================
# Docker Network
# ==============================================================
networks:

  devops:
    name: peach-devops
    driver: bridge
