map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name peachsoft.peach-cloud.test;

    client_max_body_size 200m;

    location = /jenkins {
        return 302 http://peachsoft.jenkins.test/;
    }

    location = /jenkins/ {
        return 302 http://peachsoft.jenkins.test/;
    }

    location = /gitlab {
        return 302 http://peachsoft.gitlab.test/;
    }

    location = /gitlab/ {
        return 302 http://peachsoft.gitlab.test/;
    }

    location = /registry {
        return 302 http://peachsoft.registry.test/;
    }

    location = /registry/ {
        return 302 http://peachsoft.registry.test/;
    }

    location = /nacos {
        return 302 /nacos/;
    }

    location /nacos/ {
        set $nacos_upstream http://nacos:8848;
        proxy_pass $nacos_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    location / {
        set $peach_front_upstream http://peach-front:80;
        proxy_pass $peach_front_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}

