map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name peach_cloud.peachsoft.com;

    client_max_body_size 200m;

    # 业务入口：仅前端 SPA + /api 反代（由 peach-front 容器内 nginx 转发到 gateway）
    # DevOps 控制台请使用独立子域，见下方 server_name 块
    location / {
        set $peach_front_upstream http://peach-front:80;
        proxy_pass $peach_front_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}

