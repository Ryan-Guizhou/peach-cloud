server:
  port: 18084

spring:
  application:
    name: peach-message
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 4e7af3ed-7a49-4e3f-bdfc-67c20b1bfd05
        group: PEACH-CLOUD
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        group: PEACH-CLOUD
        namespace: 4e7af3ed-7a49-4e3f-bdfc-67c20b1bfd05
  config:
    import:
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}?group=${spring.cloud.nacos.config.group}&namespace=${spring.cloud.nacos.config.namespace}

#redis 初始化配置(默认)
peach.redis:
  # ============================
  # 布隆过滤器配置
  # ============================
  bloom:
    enabled: true
    default-namespace: default
    enable-local-cache: true
    key-prefix: bloom
    load-factor: 0.9
    max-segments: 32
    false-positive-probability: 0.001
    initial-capacity: 1000000
    scale-factor: 2.0
  # ============================
  # 基础配置
  # ============================
  mode: standalone
  host: 127.0.0.1:6379       # Redis 主机
  password: 123456         # 密码（可空）
  database: 0                # DB index
  sentinelMaster: master     # 哨兵模式主节点名
  # ============================
  # Redisson 配置
  # ============================
  redisson:
    enabled: true                     # 是否开启 redisson
    # 线程 & Netty
    threads: 16                       # 业务线程池大小
    netty-threads: 32                 # Netty 线程池大小
    # 超时设置
    timeout: 3000                     # 命令等待超时时间
    idle-connection-timeout: 10000    # 空闲连接超时
    ping-timeout: 1000                # Ping 超时
    connect-timeout: 10000            # 连接超时
    # 重试
    retry-attempts: 3                 # 最大重试次数
    retry-interval: 1500              # 重试间隔
    # 连接池
    connection-pool-size: 64               # 主连接池大小
    connection-minimum-idle-size: 10       # 主最小空闲连接数
    subscription-connection-pool-size: 50  # 订阅连接池大小
    subscription-connection-minimum-idle-size: 1  # 最小订阅连接
    # 主从 & 分片
    slave-connection-minimum-idle-size: 10    # 从节点最小空闲连接
    master-connection-minimum-idle-size: 10   # 主节点最小空闲连接
    slave-connection-pool-size: 64            # 从节点连接池
    master-connection-pool-size: 64           # 主节点连接池
    # 集群额外配置
    scan-interval: 1000             # 集群监控扫描间隔（毫秒）
    subscriptions-per-connection: 5 # 每个连接最大订阅数
    # SSL
    ssl-enable: false               # 启用 SSL？
sa-token:
  token-name: Authorization
  is-log: true
  is-color-log: true
