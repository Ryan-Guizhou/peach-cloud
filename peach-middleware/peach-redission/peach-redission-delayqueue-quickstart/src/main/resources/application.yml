spring:
  application:
    name: peach-redission-delayqueue-quickstart
  main:
    web-application-type: none

peach:
  redis:
    mode: standalone
    host: ${PEACH_REDIS_HOST:127.0.0.1:6379}
    password: ${PEACH_REDIS_PASSWORD:}
    database: 1
  delay:
    queue:
      isolation-region-count: 1
      enabled: true
      max-attempts: 2
      retry-initial: 1s
      retry-max: 1m

quickstart:
  delayqueue:
    demo:
      enabled: true
