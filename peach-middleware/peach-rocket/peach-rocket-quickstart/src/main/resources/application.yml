spring:
  application:
    name: peach-rocket-quickstart

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: peach-rocket-quickstart-producer

peach:
  rocket:
    namespace: dev
    app-name: peach-rocket-quickstart
    naming:
      topic-prefix: biz
      topic-separator: '-'
    consumer:
      dynamic-register: true
    topic:
      auto-create: false
    outbox:
      enabled: false

quickstart:
  rocket:
    demo:
      enabled: true
server:
  port: 8081

