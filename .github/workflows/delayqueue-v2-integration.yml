name: Delay Queue V2 Redis Integration

on:
  pull_request:
    paths:
      - '.github/workflows/delayqueue-v2-integration.yml'
      - 'peach-middleware/peach-redission/peach-redission-delayqueue-*/**'
      - 'peach-middleware/peach-redission/peach-redisson-*/**'
      - 'peach-dependencies/pom.xml'
      - 'pom.xml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delayqueue-v2-integration.yml'
      - 'peach-middleware/peach-redission/peach-redission-delayqueue-*/**'

permissions:
  contents: read

jobs:
  redis-v2-integration:
    name: Redis 7.2 V2 Lua integration (required)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_REDIS_V2_IT: 'true'
      REDIS_IT_HOST: '127.0.0.1'
      REDIS_IT_PORT: '6379'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Lua protocol against real Redis
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl peach-middleware/peach-redission/peach-redission-delayqueue-quickstart -am \
            -Dtest=DelayQueueV2ServerIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Confirm all Delay Queue V2 Redis integration tests executed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("peach-middleware/peach-redission/peach-redission-delayqueue-quickstart/target/surefire-reports/TEST-com.peach.redission.delayqueue.quickstart.DelayQueueV2ServerIntegrationTest.xml")
          if not report.is_file():
              raise SystemExit(f"Missing V2 Redis integration test result: {report}")
          suite = ET.parse(report).getroot()
          counts = {k: int(suite.get(k, "0")) for k in ("tests", "failures", "errors", "skipped")}
          if counts["tests"] != 7 or any(counts[k] for k in ("failures", "errors", "skipped")):
              raise SystemExit(f"Expected seven executed DelayQueue V2 tests: {counts}")
          print(f"DelayQueue V2 recovery and concurrency suite passed: {counts}")
          PY
