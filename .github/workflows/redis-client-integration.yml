name: Redis Client and Sa-Token Integration

on:
  pull_request:
    paths:
      - '.github/workflows/redis-client-integration.yml'
      - 'peach-middleware/peach-redis/**'
      - 'peach-middleware/peach-redission/peach-redisson-*/**'
      - 'peach-middleware/peach-satoken/**'
      - 'peach-component/peach-captcha/**'
      - 'peach-auth/**'
      - 'peach-setting/**'
      - 'peach-message/**'
      - 'peach-fileservice/**'
      - 'peach-generator/**'
      - 'peach-monitor/**'
      - 'peach-scheduled/**'
      - 'peach-dependencies/pom.xml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/redis-client-integration.yml'
      - 'peach-middleware/peach-satoken/**'

permissions:
  contents: read

jobs:
  redis-client-integration:
    name: Redis-only, Redisson-only, Redis Tool and Sa-Token Redis tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_REDIS_CLIENT_IT: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify independent clients and persisted Sa-Token login/logout
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp \
            -pl peach-middleware/peach-redis/peach-redis-quickstart,peach-middleware/peach-redis/peach-redis-tool-quickstart,peach-middleware/peach-redission/peach-redisson-quickstart,peach-middleware/peach-satoken/peach-satoken-quickstart,peach-middleware/peach-redis/peach-redis-stream-quickstart \
            -am \
            -Dtest=RedisOnlyServerIntegrationTest,RedisToolServerIntegrationTest,RedissonOnlyServerIntegrationTest,SaTokenRedisServerIntegrationTest,RedisStreamRecoveryServerIntegrationTest,SaTokenSearchServerIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify Redis Stream Pending tests actually executed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("peach-middleware/peach-redis/peach-redis-stream-quickstart/target/surefire-reports/TEST-com.peach.redis.stream.quickstart.RedisStreamRecoveryServerIntegrationTest.xml")
          if not report.is_file():
              raise SystemExit(f"Missing real Redis Stream integration report: {report}")
          suite = ET.parse(report).getroot()
          stats = {name: int(suite.get(name, "0")) for name in ("tests", "failures", "errors", "skipped")}
          if stats["tests"] != 3 or any(stats[name] for name in ("failures", "errors", "skipped")):
              raise SystemExit(f"Unexpected real Redis Stream IT result: {stats}")
          print(f"Real Redis Stream recovery integration passed: {stats}")
          PY
      - name: Enforce non-skipped Sa-Token scan search in real Redis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("peach-middleware/peach-satoken/peach-satoken-quickstart/target/surefire-reports/TEST-com.peach.satoken.quickstart.SaTokenSearchServerIntegrationTest.xml")
          if not p.is_file():
              raise SystemExit(f"Missing Sa-Token search test: {p}")
          root = ET.parse(p).getroot()
          vals = {a: int(root.get(a, "0")) for a in ("tests", "failures", "errors", "skipped")}
          if vals["tests"] != 1 or any(vals[k] for k in ("failures", "errors", "skipped")):
              raise SystemExit(f"Invalid Sa-Token search test result: {vals}")
          print(f"Real Sa-Token SCAN test passed: {vals}")
          PY
