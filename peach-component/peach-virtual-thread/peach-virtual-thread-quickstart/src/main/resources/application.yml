spring:
  application:
    name: peach-virtual-thread-quickstart
  main:
    web-application-type: none

peach:
  virtual-thread:
    enabled: true
    thread-name-prefix: peach-vt-
    shutdown-await: 30s
    groups:
      database:
        max-concurrency: 4
        max-pending: 8
        backpressure: BLOCK
        acquire-timeout: 200ms
      burst:
        max-concurrency: 1
        max-pending: 0
        backpressure: REJECT

quickstart:
  virtual-thread:
    demo:
      enabled: true
