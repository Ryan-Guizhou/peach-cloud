spring:
  application:
    name: peach-scheduler-quickstart
  main:
    web-application-type: none

peach:
  scheduler:
    enabled: true
    rocket:
      require-jdbc: false
    executor:
      application-name: ${spring.application.name}
      instance-id: qs-scheduler-instance
      default-timeout-ms: 5000
  virtual-thread:
    enabled: true
    groups:
      scheduler:
        max-concurrency: 4
        max-pending: 8
        backpressure: REJECT
  rocket:
    enabled: false
    app-name: ${spring.application.name}
    consumer:
      dynamic-register: true
      enable-idempotent: true
    outbox:
      enabled: false
    topic:
      auto-create: false

# 默认关闭：避免每次启动都跑完整执行器编排；需要日志演示时设为 true
quickstart:
  scheduler:
    demo:
      enabled: false
