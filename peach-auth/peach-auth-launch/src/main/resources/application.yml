spring:
  profiles:
    active: @project.profile@

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 600
  is-concurrent: true
  is-share: true
  check-same-token: true
  same-token-timeout: 30
  is-read-header: true
  is-read-cookie: false
  is-log: true

peach:
  satoken:
    user-context:
      service-token-only-endpoints:
        - method: POST
          path: /auth/external/iam/check-api
        - method: POST
          path: /auth/external/iam/context
        - method: POST
          path: /auth/external/iam/directory/members
        - method: POST
          path: /auth/external/iam/directory/organizations
  captcha:
    cache-type: REDIS
    service-type: BLOCKPUZZLE
